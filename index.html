<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Para usted, Val, mi perfect girl 🌻</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap');
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#020306;color:#fff;font-family:"Cormorant Garamond",serif}
#app{height:100dvh;width:100%;position:relative;overflow:hidden;background:
radial-gradient(circle at 50% 68%,rgba(255,207,50,.13),transparent 25%),
radial-gradient(circle at 50% 35%,#111b12 0,#05090a 42%,#010204 80%)}
#sky{position:absolute;inset:0}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.15;animation:blink 3s ease-in-out infinite}
@keyframes blink{50%{opacity:.9;transform:scale(1.8)}}
.moon{position:absolute;top:8%;right:12%;width:80px;height:80px;border-radius:50%;
background:radial-gradient(circle at 35% 35%,#fffce2,#f4dc86 48%,#b99445 100%);box-shadow:0 0 50px rgba(255,222,120,.3);opacity:.65}
.scene{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end}
.ground{position:absolute;bottom:4%;width:90%;height:90px;border-radius:50%;background:radial-gradient(ellipse,rgba(70,100,38,.35),transparent 68%);filter:blur(5px)}
.title{position:absolute;top:8%;width:90%;text-align:center;z-index:20;opacity:0;animation:titleIn 2s .7s forwards}
.title .small{font-size:20px;letter-spacing:4px;text-transform:uppercase;opacity:.75}
.title h1{font-size:clamp(42px,12vw,72px);line-height:.95;margin:8px 0 0;font-weight:500;text-shadow:0 0 24px rgba(255,221,75,.4)}
.title h1 span{font-family:"Great Vibes",cursive;color:#ffe26b}
@keyframes titleIn{to{opacity:1;transform:translateY(0)}}
.title{transform:translateY(20px)}
.bouquet{position:absolute;bottom:5%;width:min(95vw,500px);height:67vh;min-height:420px}
.stem{position:absolute;bottom:0;left:50%;width:7px;border-radius:20px;transform-origin:bottom;
background:linear-gradient(90deg,#244a24,#9acb45,#244a24);box-shadow:0 0 8px rgba(120,190,55,.25);
animation:stemGrow 2.7s cubic-bezier(.2,.85,.2,1) both}
.s1{height:64%;transform:translateX(-50%) rotate(-18deg);animation-delay:.3s}
.s2{height:76%;transform:translateX(-50%) rotate(-7deg);animation-delay:.55s}
.s3{height:72%;transform:translateX(-50%) rotate(8deg);animation-delay:.8s}
.s4{height:60%;transform:translateX(-50%) rotate(19deg);animation-delay:1.05s}
@keyframes stemGrow{from{transform:translateX(-50%) rotate(var(--r,0deg)) scaleY(0)}to{transform:translateX(-50%) rotate(var(--r,0deg)) scaleY(1)}}
.leaf{position:absolute;width:100px;height:43px;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#b7e75a,#377b2c 70%,#1d4c20);box-shadow:0 0 12px rgba(90,190,55,.2);opacity:0;animation:leafIn 1.1s 2.2s forwards}
.l1{left:5%;bottom:29%;transform:rotate(22deg)}.l2{left:19%;bottom:14%;transform:rotate(-28deg)}
.l3{right:2%;bottom:26%;transform:rotate(156deg)}.l4{right:16%;bottom:12%;transform:rotate(193deg)}
@keyframes leafIn{from{opacity:0;transform:scale(.1) rotate(0)}to{opacity:1}}
.flower{position:absolute;width:142px;height:142px;opacity:0;transform:translateY(80px) scale(.05)}
.f1{left:2%;top:17%;animation:bloom 1.7s 2.0s cubic-bezier(.2,.9,.2,1) forwards}
.f2{left:32%;top:3%;animation:bloom 1.7s 2.35s cubic-bezier(.2,.9,.2,1) forwards}
.f3{right:0;top:19%;animation:bloom 1.7s 2.7s cubic-bezier(.2,.9,.2,1) forwards}
.f4{left:18%;top:33%;animation:bloom 1.7s 3.05s cubic-bezier(.2,.9,.2,1) forwards}
.f5{right:17%;top:35%;animation:bloom 1.7s 3.4s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes bloom{0%{opacity:0;transform:translateY(80px) scale(.03) rotate(-20deg)}65%{opacity:1;transform:translateY(-8px) scale(1.08) rotate(4deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
.petal{position:absolute;left:50%;top:50%;width:45px;height:76px;margin:-38px -22px;border-radius:55% 55% 48% 48%;background:radial-gradient(circle at 50% 70%,#fffbd0 0,#fff15b 44%,#f5bf08 100%);box-shadow:0 0 14px rgba(255,215,30,.7);transform-origin:50% 100%}
.petal:nth-child(1){transform:rotate(0) translateY(-25px)}.petal:nth-child(2){transform:rotate(45deg) translateY(-25px)}
.petal:nth-child(3){transform:rotate(90deg) translateY(-25px)}.petal:nth-child(4){transform:rotate(135deg) translateY(-25px)}
.petal:nth-child(5){transform:rotate(180deg) translateY(-25px)}.petal:nth-child(6){transform:rotate(225deg) translateY(-25px)}
.petal:nth-child(7){transform:rotate(270deg) translateY(-25px)}.petal:nth-child(8){transform:rotate(315deg) translateY(-25px)}
.center{position:absolute;left:50%;top:50%;width:50px;height:50px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#ffd958 0 15%,#7d4b10 17% 28%,#d08b18 30% 48%,#70400b 50% 100%);box-shadow:0 0 12px rgba(255,191,20,.8)}
.falling{position:absolute;top:-50px;color:#ffe04b;font-size:22px;opacity:0;animation:fall 8s linear infinite}
@keyframes fall{0%{opacity:0;transform:translate(0,-30px) rotate(0)}10%{opacity:.9}100%{opacity:0;transform:translate(100px,110vh) rotate(360deg)}}
.message{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;pointer-events:none}
.message-box{max-width:650px;margin-top:-3vh;opacity:0;animation:messageIn 2s 6.1s forwards}
.message .line1{font-size:clamp(27px,7vw,48px);margin-bottom:10px}
.message .line2{font-family:"Great Vibes",cursive;color:#ffe36a;font-size:clamp(44px,12vw,78px);line-height:1}
.message .line3{font-size:clamp(23px,6vw,38px);margin-top:12px}
.message .heart{font-size:34px;color:#ffdd43}
@keyframes messageIn{from{opacity:0;transform:translateY(25px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.music{position:absolute;z-index:50;left:50%;bottom:15px;transform:translateX(-50%);width:min(92vw,390px);background:rgba(8,9,8,.72);border:1px solid rgba(255,226,93,.28);border-radius:18px;padding:9px;backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.music-label{text-align:center;font:12px Arial,sans-serif;color:#f9eaa0;margin-bottom:5px}
.music iframe{display:block;width:100%;border-radius:12px}
.music a{display:block;text-align:center;color:#ffe36c;text-decoration:none;font:11px Arial,sans-serif;margin-top:5px}
#enter{position:absolute;z-index:100;inset:0;background:radial-gradient(circle,#18200f,#020306 70%);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;transition:opacity 1.2s}
#enter.hide{opacity:0;pointer-events:none}
#enter p{font-size:19px;letter-spacing:2px;opacity:.75;margin:0 0 12px}
#enter h2{font-family:"Great Vibes",cursive;font-size:clamp(48px,14vw,82px);font-weight:400;color:#ffe36a;margin:0 0 25px}
#start{border:1px solid rgba(255,226,90,.7);background:rgba(255,215,40,.08);color:#fff5bd;padding:13px 26px;border-radius:30px;font-size:16px;letter-spacing:1px;backdrop-filter:blur(8px)}

@media (max-width:600px){
  .title{top:5%;width:94%}
  .title .small{font-size:14px;letter-spacing:2.5px}
  .title h1{font-size:clamp(36px,11vw,54px);margin-top:6px}
  .bouquet{width:min(108vw,430px);height:58vh;min-height:360px;bottom:7%}
  .flower{width:112px;height:112px}
  .f1{left:1%;top:17%}.f2{left:31%;top:2%}.f3{right:0;top:19%}.f4{left:17%;top:34%}.f5{right:15%;top:36%}
  .petal{width:36px;height:61px;margin:-30px -18px}
  .center{width:41px;height:41px}
  .leaf{width:78px;height:34px}
  .message{padding:14px}
  .message-box{width:96%;margin-top:-4vh}
  .message .line1{font-size:clamp(24px,7vw,36px)}
  .message .line2{font-size:clamp(42px,12vw,62px)}
  .message .line3{font-size:clamp(20px,5.8vw,30px)}
  .music{bottom:max(8px,env(safe-area-inset-bottom));width:min(92vw,360px);padding:7px}
  .music iframe{height:72px}
  #enter p{font-size:15px;padding:0 20px}
  #enter h2{font-size:clamp(44px,14vw,68px)}
}
@media (max-height:700px) and (max-width:600px){
  .bouquet{height:52vh;bottom:6%}
  .title{top:4%}
  .message-box{margin-top:-7vh}
}
</style>
</head>
<body>
<div id="app">
  <div id="sky"></div><div class="moon"></div>
  <div id="enter">
    <p>UN PEQUEÑO DETALLE PARA USTED</p>
    <h2>Val, mi perfect girl…</h2>
    <button id="start">🌻 Abrir mi regalo</button>
  </div>
  <div class="title"><div class="small">Hoy pensé en usted</div><h1>Para usted, Val, <span>mi perfect girl</span></h1></div>
  <div class="scene">
    <div class="ground"></div>
    <div class="bouquet">
      <div class="stem s1"></div><div class="stem s2"></div><div class="stem s3"></div><div class="stem s4"></div>
      <div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div><div class="leaf l4"></div>
      <div class="flower f1"></div><div class="flower f2"></div><div class="flower f3"></div><div class="flower f4"></div><div class="flower f5"></div>
    </div>
  </div>
  <div class="message"><div class="message-box">
    <div class="line1">Me acordé de usted…</div>
    <div class="line2">Val, mi perfect girl.</div>
    <div class="line3">La amo mucho, <b>Val</b> <span class="heart">♥</span></div>
  </div></div>
  <div class="music">
    <div class="music-label">♪ Una canción para usted · Bruno Mars</div>
    <iframe src="https://open.spotify.com/embed/track/6skX6In6VpLzev9epAUnpp?utm_source=generator&theme=0" height="80" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    <a href="https://www.youtube.com/watch?v=lY5V4hSLWY8" target="_blank">▶ Ver “Risk It All” — video oficial</a>
  </div>
</div>
<script>
const sky=document.getElementById('sky');
for(let i=0;i<120;i++){let s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*4+'s';sky.appendChild(s)}
document.querySelectorAll('.flower').forEach(f=>{for(let i=0;i<8;i++){let p=document.createElement('span');p.className='petal';f.appendChild(p)}let c=document.createElement('span');c.className='center';f.appendChild(c)})
for(let i=0;i<22;i++){let p=document.createElement('span');p.className='falling';p.textContent='✦';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*8+'s';p.style.animationDuration=(6+Math.random()*5)+'s';document.getElementById('app').appendChild(p)}
document.getElementById('start').onclick=()=>document.getElementById('enter').classList.add('hide');
</script>
</body>
</html>
