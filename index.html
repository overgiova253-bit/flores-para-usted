<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Para usted, Val, mi perfect girl 🌻</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap');
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#020306;color:#fff;font-family:"Cormorant Garamond",serif}
#app{height:100dvh;width:100%;position:relative;overflow:hidden;background:
radial-gradient(circle at 50% 68%,rgba(255,207,50,.13),transparent 25%),
radial-gradient(circle at 50% 35%,#111b12 0,#05090a 42%,#010204 80%)}
#sky{position:absolute;inset:0}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.15;animation:blink 3s ease-in-out infinite}
@keyframes blink{50%{opacity:.9;transform:scale(1.8)}}
.moon{position:absolute;top:8%;right:12%;width:80px;height:80px;border-radius:50%;
background:radial-gradient(circle at 35% 35%,#fffce2,#f4dc86 48%,#b99445 100%);
box-shadow:0 0 50px rgba(255,222,120,.3);opacity:.65}
.scene{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end}
.ground{position:absolute;bottom:4%;width:90%;height:90px;border-radius:50%;
background:radial-gradient(ellipse,rgba(70,100,38,.35),transparent 68%);filter:blur(5px)}
.title{position:absolute;top:8%;width:90%;text-align:center;z-index:20;opacity:0;animation:titleIn 2s .7s forwards}
.title .small{font-size:20px;letter-spacing:4px;text-transform:uppercase;opacity:.75}
.title h1{font-size:clamp(42px,12vw,72px);line-height:.95;margin:8px 0 0;font-weight:500;
text-shadow:0 0 24px rgba(255,221,75,.4)}
.title h1 span{font-family:"Great Vibes",cursive;color:#ffe26b}
@keyframes titleIn{to{opacity:1;transform:translateY(0)}}
.title{transform:translateY(20px)}

.bouquet{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
width:100vw;height:55vh;min-height:390px;max-width:500px}

/* Tallos: lentos y suaves */
.stem{position:absolute;bottom:0;left:50%;width:7px;border-radius:20px;transform-origin:bottom;
background:linear-gradient(90deg,#244a24,#9acb45,#244a24);
box-shadow:0 0 8px rgba(120,190,55,.25);
animation:stemGrow 3.4s cubic-bezier(.22,.75,.2,1) both}
.s1{height:58%;transform:translateX(-50%) rotate(-18deg);animation-delay:.8s}
.s2{height:72%;transform:translateX(-50%) rotate(-7deg);animation-delay:1.05s}
.s3{height:68%;transform:translateX(-50%) rotate(8deg);animation-delay:1.3s}
.s4{height:55%;transform:translateX(-50%) rotate(19deg);animation-delay:1.55s}
@keyframes stemGrow{
from{transform:translateX(-50%) rotate(var(--r,0deg)) scaleY(0)}
to{transform:translateX(-50%) rotate(var(--r,0deg)) scaleY(1)}
}

.leaf{position:absolute;width:92px;height:40px;border-radius:100% 0 100% 0;
background:linear-gradient(135deg,#b7e75a,#377b2c 70%,#1d4c20);
box-shadow:0 0 12px rgba(90,190,55,.2);opacity:0;
animation:leafIn 1.5s 3.1s forwards}
.l1{left:5%;bottom:29%;transform:rotate(22deg)}
.l2{left:18%;bottom:14%;transform:rotate(-28deg)}
.l3{right:5%;bottom:26%;transform:rotate(156deg)}
.l4{right:18%;bottom:12%;transform:rotate(193deg)}
@keyframes leafIn{from{opacity:0;transform:scale(.1) rotate(0)}to{opacity:1}}

.flower{position:absolute;width:142px;height:142px;opacity:0;
transform:translateY(55px) scale(.04) rotate(-14deg);
will-change:transform,opacity}

/* Posiciones diseñadas para iPhone: ninguna flor sale de la pantalla */
.f1{left:8px;top:20%;animation:bloom 2.8s 2.2s cubic-bezier(.16,.72,.18,1) forwards}
.f2{left:50%;margin-left:-71px;top:2%;animation:bloom 2.8s 2.9s cubic-bezier(.16,.72,.18,1) forwards}
.f3{right:8px;top:20%;animation:bloom 2.8s 3.6s cubic-bezier(.16,.72,.18,1) forwards}
.f4{left:48px;top:45%;animation:bloom 2.8s 4.3s cubic-bezier(.16,.72,.18,1) forwards}
.f5{right:48px;top:47%;animation:bloom 2.8s 5.0s cubic-bezier(.16,.72,.18,1) forwards}

@keyframes bloom{
0%{opacity:0;transform:translateY(55px) scale(.04) rotate(-14deg)}
45%{opacity:.55;transform:translateY(18px) scale(.70) rotate(-5deg)}
75%{opacity:.92;transform:translateY(-5px) scale(1.04) rotate(2deg)}
90%{opacity:1;transform:translateY(2px) scale(.98) rotate(-1deg)}
100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}
}

.petal{position:absolute;left:50%;top:50%;width:45px;height:76px;margin:-38px -22px;
border-radius:55% 55% 48% 48%;
background:radial-gradient(circle at 50% 70%,#fffbd0 0,#fff15b 44%,#f5bf08 100%);
box-shadow:0 0 14px rgba(255,215,30,.7);transform-origin:50% 100%}
.petal:nth-child(1){transform:rotate(0) translateY(-25px)}
.petal:nth-child(2){transform:rotate(45deg) translateY(-25px)}
.petal:nth-child(3){transform:rotate(90deg) translateY(-25px)}
.petal:nth-child(4){transform:rotate(135deg) translateY(-25px)}
.petal:nth-child(5){transform:rotate(180deg) translateY(-25px)}
.petal:nth-child(6){transform:rotate(225deg) translateY(-25px)}
.petal:nth-child(7){transform:rotate(270deg) translateY(-25px)}
.petal:nth-child(8){transform:rotate(315deg) translateY(-25px)}

.center{position:absolute;left:50%;top:55%;width:50px;height:50px;
transform:translate(-50%,-50%);border-radius:50%;
background:radial-gradient(circle,#ffd958 0 15%,#7d4b10 17% 28%,#d08b18 30% 48%,#70400b 50% 100%);
box-shadow:0 0 12px rgba(255,191,20,.8)}

.falling{position:absolute;top:-50px;color:#ffe04b;font-size:22px;opacity:0;animation:fall 8s linear infinite}
@keyframes fall{0%{opacity:0;transform:translate(0,-30px) rotate(0)}
10%{opacity:.9}100%{opacity:0;transform:translate(100px,110vh) rotate(360deg)}}

.message{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
text-align:center;padding:20px;pointer-events:none}
.message-box{max-width:650px;margin-top:-2vh;opacity:0;animation:messageIn 2s 8.4s forwards}
.message .line1{font-size:clamp(27px,7vw,48px);margin-bottom:10px}
.message .line2{font-family:"Great Vibes",cursive;color:#ffe36a;font-size:clamp(44px,12vw,78px);line-height:1}
.message .line3{font-size:clamp(23px,6vw,38px);margin-top:12px}
.message .heart{font-size:34px;color:#ffdd43}
@keyframes messageIn{from{opacity:0;transform:translateY(25px);filter:blur(8px)}
to{opacity:1;transform:none;filter:blur(0)}}

.music{position:absolute;z-index:50;left:50%;bottom:15px;transform:translateX(-50%);
width:min(92vw,390px);background:rgba(8,9,8,.72);border:1px solid rgba(255,226,93,.28);
border-radius:18px;padding:9px;backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.music-label{text-align:center;font:12px Arial,sans-serif;color:#f9eaa0;margin-bottom:5px}
.music iframe{display:block;width:100%;border-radius:12px}
.music a{display:block;text-align:center;color:#ffe36c;text-decoration:none;font:11px Arial,sans-serif;margin-top:5px}

#enter{position:absolute;z-index:100;inset:0;background:radial-gradient(circle,#18200f,#020306 70%);
display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;transition:opacity 1.2s}
#enter.hide{opacity:0;pointer-events:none}
#enter p{font-size:19px;letter-spacing:2px;opacity:.75;margin:0 0 12px}
#enter h2{font-family:"Great Vibes",cursive;font-size:clamp(48px,14vw,82px);font-weight:400;color:#ffe36a;margin:0 0 25px}
#start{border:1px solid rgba(255,226,90,.7);background:rgba(255,215,40,.08);color:#fff5bd;
padding:13px 26px;border-radius:30px;font-size:16px;letter-spacing:1px;backdrop-filter:blur(8px)}

@media (max-width:600px){
  .title{top:7%;width:94%}
  .title .small{font-size:16px;letter-spacing:3px}
  .title h1{font-size:clamp(40px,11.5vw,62px)}
  .moon{width:76px;height:76px;right:9%;top:8%}
  .bouquet{width:100vw;height:55vh;min-height:390px;bottom:0}
  .flower{width:142px;height:142px}
  .message{padding:12px}
  .message-box{width:94%;margin-top:-5vh}
  .message .line1{font-size:clamp(25px,7vw,38px)}
  .message .line2{font-size:clamp(42px,12vw,62px)}
  .message .line3{font-size:clamp(20px,5.8vw,30px)}
  .music{bottom:max(8px,env(safe-area-inset-bottom));width:min(92vw,360px);padding:7px}
  .music iframe{height:72px}
  #enter p{font-size:15px;padding:0 20px}
  #enter h2{font-size:clamp(44px,14vw,68px)}
}
</style>
</head>
<body>
<div id="app">
  <div id="sky"></div><div class="moon"></div>

  <div id="enter">
    <p>UN PEQUEÑO DETALLE PARA USTED</p>
    <h2>Val, mi perfect girl…</h2>
    <button id="start">🌻 Abrir mi regalo</button>
  </div>

  <div class="title">
    <div class="small">Hoy pensé en usted</div>
    <h1>Para usted, Val, <span>mi perfect girl</span></h1>
  </div>

  <div class="scene">
    <div class="ground"></div>
    <div class="bouquet">
      <div class="stem s1"></div><div class="stem s2"></div><div class="stem s3"></div><div class="stem s4"></div>
      <div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div><div class="leaf l4"></div>
      <div class="flower f1"></div><div class="flower f2"></div><div class="flower f3"></div>
      <div class="flower f4"></div><div class="flower f5"></div>
    </div>
  </div>

  <div class="message">
    <div class="message-box">
      <div class="line1">Me acordé de usted…</div>
      <div class="line2">Val, mi perfect girl.</div>
      <div class="line3">La amo mucho, <b>Val</b> <span class="heart">♥</span></div>
    </div>
  </div>

  <div class="music">
    <div class="music-label">♪ Una canción para usted · Bruno Mars</div>
    <iframe src="https://open.spotify.com/embed/track/6skX6In6VpLzev9epAUnpp?utm_source=generator&theme=0"
      height="80" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    <a href="https://www.youtube.com/watch?v=lY5V4hSLWY8" target="_blank">▶ Ver “Risk It All” — video oficial</a>
  </div>
</div>

<script>
const sky=document.getElementById('sky');
for(let i=0;i<120;i++){
  let s=document.createElement('i');
  s.className='star';
  s.style.left=Math.random()*100+'%';
  s.style.top=Math.random()*100+'%';
  s.style.animationDelay=Math.random()*4+'s';
  sky.appendChild(s);
}

document.querySelectorAll('.flower').forEach(f=>{
  for(let i=0;i<8;i++){
    let p=document.createElement('span');
    p.className='petal';
    f.appendChild(p);
  }
  let c=document.createElement('span');
  c.className='center';
  f.appendChild(c);
});

for(let i=0;i<22;i++){
  let p=document.createElement('span');
  p.className='falling';
  p.textContent='✦';
  p.style.left=Math.random()*100+'%';
  p.style.animationDelay=Math.random()*8+'s';
  p.style.animationDuration=(6+Math.random()*5)+'s';
  document.getElementById('app').appendChild(p);
}

document.getElementById('start').onclick=()=>{
  document.getElementById('enter').classList.add('hide');
};
</script>
</body>
</html>
