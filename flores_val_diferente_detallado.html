<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Para usted, Val 🌻</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap');

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#030606;color:#fff;font-family:"Cormorant Garamond",serif}

.scene{
  position:relative;width:100%;height:100dvh;overflow:hidden;
  background:
    radial-gradient(circle at 50% 48%,rgba(85,125,55,.15),transparent 28%),
    linear-gradient(180deg,#020507 0%,#07100d 58%,#020504 100%);
}

/* cielo */
.stars{position:absolute;inset:0}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.35;animation:blink 4s ease-in-out infinite}
@keyframes blink{50%{opacity:1;transform:scale(1.7)}}

.glow{
  position:absolute;left:50%;top:47%;width:390px;height:390px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(242,204,66,.10),transparent 68%);
  filter:blur(10px)
}

/* luna decorativa pequeña y separada del texto */
.moon{
  position:absolute;right:8%;top:8%;width:66px;height:66px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#fff8d2,#e4c66e 55%,#9b7838);
  opacity:.6;box-shadow:0 0 35px rgba(240,208,105,.22)
}

/* encabezado */
.header{
  position:absolute;z-index:20;top:6%;left:50%;width:92%;
  transform:translateX(-50%);text-align:center
}
.kicker{font-size:15px;letter-spacing:4px;text-transform:uppercase;opacity:.7}
.header h1{
  margin:10px 0 0;font-weight:500;font-size:clamp(38px,10.8vw,59px);
  line-height:.98
}
.header h1 span{font-family:"Great Vibes",cursive;color:#ffe06a}
.rule{width:80px;height:1px;margin:13px auto 0;background:rgba(255,224,106,.55)}

/* carta */
.card{
  position:absolute;z-index:30;left:50%;top:34%;transform:translateX(-50%);
  width:min(88vw,430px);text-align:center;padding:18px 12px 16px;
  background:linear-gradient(180deg,rgba(8,15,11,.52),rgba(4,9,7,.28));
  border:1px solid rgba(255,222,99,.14);border-radius:24px;
  box-shadow:0 12px 50px rgba(0,0,0,.22)
}
.card:before,.card:after{
  content:"✦";position:absolute;color:#f7d85c;font-size:15px;opacity:.7
}
.card:before{left:15px;top:12px}.card:after{right:15px;bottom:12px}
.card .intro{font-size:clamp(23px,6.5vw,33px);margin-bottom:2px}
.card .name{font-family:"Great Vibes",cursive;font-size:clamp(47px,12vw,67px);line-height:1;color:#ffe06a}
.card .love{font-size:clamp(20px,5.5vw,28px);margin-top:7px}
.card .love b{font-weight:700}

/* ramo */
.bouquet{
  position:absolute;z-index:10;left:50%;bottom:-7px;
  width:min(100vw,520px);height:47%;transform:translateX(-50%)
}
.stem{
  position:absolute;left:50%;bottom:0;width:7px;border-radius:10px;
  transform-origin:bottom;background:linear-gradient(90deg,#193d22,#9ed64a,#244b24);
  box-shadow:0 0 10px rgba(123,196,62,.35);
  animation:growStem 2.8s cubic-bezier(.2,.8,.2,1) both
}
.s1{height:74%;margin-left:-68px;animation-delay:.8s}
.s2{height:84%;margin-left:-28px;animation-delay:1s}
.s3{height:89%;margin-left:0;animation-delay:1.2s}
.s4{height:83%;margin-left:28px;animation-delay:1.4s}
.s5{height:73%;margin-left:68px;animation-delay:1.6s}
@keyframes growStem{from{transform:scaleY(0)}to{transform:scaleY(1)}}

.leaf{
 position:absolute;width:94px;height:38px;border-radius:100% 0 100% 0;
 background:linear-gradient(135deg,#a7dc54,#3c8131 70%,#1d4b20);
 opacity:0;animation:leafIn 1.3s 3.5s forwards
}
.leaf1{left:0;bottom:18%;transform:rotate(18deg)}
.leaf2{left:16%;bottom:6%;transform:rotate(-28deg)}
.leaf3{right:0;bottom:18%;transform:rotate(162deg)}
.leaf4{right:16%;bottom:6%;transform:rotate(198deg)}
@keyframes leafIn{from{opacity:0;scale:.15}to{opacity:1;scale:1}}

/* flores dibujadas como SVG: el centro nunca puede separarse de los pétalos */
.flower{
 position:absolute;width:156px;height:156px;opacity:0;
 animation:flowerBloom 2.8s cubic-bezier(.16,.78,.18,1) forwards
}
.flower svg{width:100%;height:100%;display:block;overflow:visible}
.fA{left:-3%;top:20%;animation-delay:2s}
.fB{left:50%;top:0;margin-left:-78px;animation-delay:2.7s}
.fC{right:-3%;top:20%;animation-delay:3.4s}
.fD{left:12%;top:40%;animation-delay:4.1s}
.fE{right:12%;top:40%;animation-delay:4.8s}

@keyframes flowerBloom{
 0%{opacity:0;transform:translateY(45px) scale(.04) rotate(-8deg)}
 55%{opacity:.65;transform:translateY(9px) scale(.72) rotate(-3deg)}
 80%{opacity:1;transform:translateY(-3px) scale(1.04) rotate(1deg)}
 100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}
}

/* pétalos suaves */
.petal{fill:url(#petal);filter:url(#glowPetal)}
.centerOuter{fill:#693b09}
.centerMid{fill:#c27b0e}
.centerInner{fill:#ffd64d}

/* pequeñas flores secundarias */
.dots{position:absolute;z-index:7;inset:0;pointer-events:none}
.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#f8d65b;box-shadow:0 0 10px #f8d65b;opacity:0;animation:dotIn 1.4s forwards}
@keyframes dotIn{to{opacity:.8}}

/* música */
.music{
 position:absolute;z-index:60;left:50%;bottom:max(8px,env(safe-area-inset-bottom));
 transform:translateX(-50%);width:min(91vw,380px);padding:8px 9px;
 border-radius:18px;background:rgba(5,8,7,.88);
 border:1px solid rgba(255,220,89,.35);backdrop-filter:blur(12px)
}
.musicTitle{text-align:center;color:#f8e8a0;font:12px Arial,sans-serif;margin-bottom:5px}
.music iframe{display:block;width:100%;height:72px;border:0;border-radius:12px}
.music a{display:block;text-align:center;margin-top:5px;color:#ffe06a;text-decoration:none;font:11px Arial,sans-serif}

/* entrada */
.cover{
 position:absolute;z-index:100;inset:0;display:flex;flex-direction:column;
 justify-content:center;align-items:center;text-align:center;
 background:radial-gradient(circle at 50% 45%,#17200f,#020406 70%);
 transition:opacity 1.3s ease
}
.cover.hide{opacity:0;pointer-events:none}
.cover .tiny{font-size:14px;letter-spacing:3px;opacity:.72}
.cover h2{font-family:"Great Vibes",cursive;font-size:clamp(50px,15vw,76px);
font-weight:400;color:#ffe06a;margin:10px 0 25px}
.open{
 padding:13px 27px;border-radius:30px;border:1px solid #f2d55e;
 background:rgba(255,218,80,.08);color:#fff4bd;font:16px "Cormorant Garamond",serif
}

@media(max-width:600px){
 .header{top:6%}
 .kicker{font-size:14px;letter-spacing:3px}
 .card{top:32%;width:90vw;padding:15px 10px}
 .bouquet{height:48%}
 .flower{width:156px;height:156px}
 .fA{left:-19px;top:20%}.fB{top:0}.fC{right:-19px;top:20%}
 .fD{left:5%;top:41%}.fE{right:5%;top:41%}
 .moon{right:7%;top:8%;width:62px;height:62px}
}
</style>
</head>
<body>
<div class="scene">
 <div class="stars" id="stars"></div>
 <div class="glow"></div>
 <div class="moon"></div>

 <div class="cover" id="cover">
   <div class="tiny">UN PEQUEÑO DETALLE PARA USTED</div>
   <h2>Val, mi perfect girl…</h2>
   <button class="open" id="open">🌻 Abrir mi regalo</button>
 </div>

 <header class="header">
   <div class="kicker">Hoy pensé en usted</div>
   <h1>Para usted, Val, <span>mi perfect girl</span></h1>
   <div class="rule"></div>
 </header>

 <section class="card">
   <div class="intro">Me acordé de usted…</div>
   <div class="name">Val, mi perfect girl.</div>
   <div class="love">La amo mucho, <b>Val</b> <span style="color:#ffdd45">♥</span></div>
 </section>

 <div class="dots" id="dots"></div>

 <div class="bouquet">
   <div class="stem s1"></div><div class="stem s2"></div><div class="stem s3"></div><div class="stem s4"></div><div class="stem s5"></div>
   <div class="leaf leaf1"></div><div class="leaf leaf2"></div><div class="leaf leaf3"></div><div class="leaf leaf4"></div>

   <div class="flower fA"></div><div class="flower fB"></div><div class="flower fC"></div><div class="flower fD"></div><div class="flower fE"></div>
 </div>

 <div class="music">
  <div class="musicTitle">♪ Una canción para usted · Bruno Mars</div>
  <iframe src="https://open.spotify.com/embed/track/6skX6In6VpLzev9epAUnpp?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
  <a href="https://www.youtube.com/watch?v=lY5V4hSLWY8" target="_blank">▶ Ver “Risk It All” — video oficial</a>
 </div>
</div>

<script>
const stars=document.getElementById("stars");
for(let i=0;i<100;i++){
 const s=document.createElement("i");s.className="star";
 s.style.left=Math.random()*100+"%";s.style.top=Math.random()*72+"%";
 s.style.animationDelay=Math.random()*4+"s";stars.appendChild(s);
}
const dots=document.getElementById("dots");
for(let i=0;i<16;i++){
 const d=document.createElement("i");d.className="dot";
 d.style.left=(8+Math.random()*84)+"%";d.style.top=(25+Math.random()*52)+"%";
 d.style.animationDelay=(1+Math.random()*6)+"s";dots.appendChild(d);
}

/* Todas las flores usan el mismo dibujo SVG, así el centro es inseparable de los pétalos. */
const flowers=document.querySelectorAll(".flower");
const ns="http://www.w3.org/2000/svg";
flowers.forEach((flower,index)=>{
 const svg=document.createElementNS(ns,"svg");
 svg.setAttribute("viewBox","0 0 156 156");

 const defs=document.createElementNS(ns,"defs");
 const grad=document.createElementNS(ns,"radialGradient");grad.id="petal"+index;
 const stops=[["0%","#fffbd6"],["45%","#fff05c"],["100%","#f4b900"]];
 stops.forEach(([o,c])=>{const st=document.createElementNS(ns,"stop");st.setAttribute("offset",o);st.setAttribute("stop-color",c);grad.appendChild(st)});
 const filter=document.createElementNS(ns,"filter");filter.id="glow"+index;
 const blur=document.createElementNS(ns,"feGaussianBlur");blur.setAttribute("stdDeviation","2.2");blur.setAttribute("result","b");
 filter.appendChild(blur);defs.appendChild(grad);defs.appendChild(filter);svg.appendChild(defs);

 const g=document.createElementNS(ns,"g");
 g.setAttribute("fill","url(#petal"+index+")");
 const cx=78,cy=78;
 for(let i=0;i<8;i++){
   const e=document.createElementNS(ns,"ellipse");
   e.setAttribute("cx",cx);e.setAttribute("cy",cy-31);
   e.setAttribute("rx","21");e.setAttribute("ry","37");
   e.setAttribute("transform",`rotate(${i*45} ${cx} ${cy})`);
   g.appendChild(e);
 }
 svg.appendChild(g);

 const outer=document.createElementNS(ns,"circle");outer.setAttribute("cx",cx);outer.setAttribute("cy",cy);outer.setAttribute("r","25");outer.setAttribute("class","centerOuter");
 const mid=document.createElementNS(ns,"circle");mid.setAttribute("cx",cx);mid.setAttribute("cy",cy);mid.setAttribute("r","18");mid.setAttribute("class","centerMid");
 const inner=document.createElementNS(ns,"circle");inner.setAttribute("cx",cx);inner.setAttribute("cy",cy);inner.setAttribute("r","10");inner.setAttribute("class","centerInner");
 svg.appendChild(outer);svg.appendChild(mid);svg.appendChild(inner);
 flower.appendChild(svg);
});

document.getElementById("open").onclick=()=>document.getElementById("cover").classList.add("hide");
</script>
</body>
</html>
