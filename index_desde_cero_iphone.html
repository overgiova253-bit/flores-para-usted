<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para usted, Val, mi perfect girl 🌻</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap');

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#020506;color:#fff;font-family:"Cormorant Garamond",serif}
#app{
  position:relative;width:100%;height:100dvh;overflow:hidden;
  background:
    radial-gradient(circle at 50% 62%,rgba(255,211,45,.12),transparent 25%),
    radial-gradient(circle at 50% 34%,#111b13 0,#050a0a 45%,#010204 82%);
}

/* estrellas */
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.2;
  animation:twinkle 3.5s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.9;transform:scale(1.7)}}

.moon{position:absolute;z-index:1;top:8%;right:10%;width:78px;height:78px;border-radius:50%;
background:radial-gradient(circle at 35% 35%,#fffce2,#f4dc86 48%,#b99445 100%);
box-shadow:0 0 45px rgba(255,222,120,.28);opacity:.65}

/* título */
.title{position:absolute;z-index:20;top:7%;left:50%;width:94%;
transform:translateX(-50%);text-align:center;opacity:0;animation:titleIn 1.8s .6s forwards}
.title .small{font-size:17px;letter-spacing:3.5px;text-transform:uppercase;opacity:.78}
.title h1{margin:8px 0 0;font-size:clamp(40px,11.5vw,62px);line-height:.98;font-weight:500;
text-shadow:0 0 24px rgba(255,221,75,.3)}
.title h1 span{font-family:"Great Vibes",cursive;color:#ffe36b}
@keyframes titleIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}
.title{transform:translateX(-50%) translateY(16px)}

/* mensaje: más arriba para dejar visible el ramo */
.message{position:absolute;z-index:25;left:50%;top:42%;width:94%;
transform:translate(-50%,-50%);text-align:center;opacity:0;
animation:messageIn 1.8s 7.8s forwards}
.message .line1{font-size:clamp(25px,7vw,39px);margin-bottom:7px}
.message .line2{font-family:"Great Vibes",cursive;color:#ffe36a;
font-size:clamp(43px,11.5vw,62px);line-height:1}
.message .line3{font-size:clamp(20px,5.8vw,30px);margin-top:10px}
.heart{font-size:30px;color:#ffdd43}
@keyframes messageIn{from{opacity:0;transform:translate(-50%,calc(-50% + 20px));filter:blur(7px)}
to{opacity:1;transform:translate(-50%,-50%);filter:blur(0)}}

/* ramo */
.bouquet{position:absolute;z-index:10;left:50%;bottom:-1%;
transform:translateX(-50%);width:100%;height:53%;max-width:500px}

/* tallos */
.stem{position:absolute;bottom:0;left:50%;width:7px;border-radius:10px;
transform-origin:bottom;background:linear-gradient(90deg,#244a24,#9acb45,#244a24);
box-shadow:0 0 9px rgba(120,190,55,.3);
animation:stem 3.2s cubic-bezier(.2,.8,.2,1) both}
.stem.s1{height:65%;margin-left:-54px;animation-delay:1.0s}
.stem.s2{height:78%;margin-left:-18px;animation-delay:1.25s}
.stem.s3{height:72%;margin-left:18px;animation-delay:1.5s}
.stem.s4{height:62%;margin-left:54px;animation-delay:1.75s}
@keyframes stem{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* hojas */
.leaf{position:absolute;width:94px;height:40px;border-radius:100% 0 100% 0;
background:linear-gradient(135deg,#b7e75a,#377b2c 70%,#1d4c20);
opacity:0;animation:leaf 1.4s 3.4s forwards}
.leaf.l1{left:4%;bottom:24%;transform:rotate(22deg)}
.leaf.l2{left:17%;bottom:9%;transform:rotate(-28deg)}
.leaf.l3{right:4%;bottom:23%;transform:rotate(156deg)}
.leaf.l4{right:17%;bottom:9%;transform:rotate(193deg)}
@keyframes leaf{from{opacity:0;transform:scale(.2)}to{opacity:1}}

/* flores: cada flor es un contenedor fijo de 142x142 */
.flower{position:absolute;width:142px;height:142px;opacity:0;
animation:bloom 2.5s cubic-bezier(.16,.75,.2,1) forwards}
.f1{left:3%;top:25%;animation-delay:2.4s}
.f2{left:50%;top:4%;margin-left:-71px;animation-delay:3.0s}
.f3{right:3%;top:25%;animation-delay:3.6s}
.f4{left:18%;top:46%;animation-delay:4.2s}
.f5{right:18%;top:46%;animation-delay:4.8s}

@keyframes bloom{
0%{opacity:0;transform:translateY(45px) scale(.04) rotate(-10deg)}
55%{opacity:.72;transform:translateY(10px) scale(.72) rotate(-3deg)}
80%{opacity:1;transform:translateY(-4px) scale(1.04) rotate(1deg)}
100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}
}

/* pétalos: todos parten del mismo centro */
.petal{position:absolute;left:50%;top:50%;width:44px;height:75px;
margin:-37.5px 0 0 -22px;border-radius:55% 55% 48% 48%;
background:radial-gradient(circle at 50% 70%,#fffbd0 0,#fff15b 44%,#f5bf08 100%);
box-shadow:0 0 14px rgba(255,215,30,.68);transform-origin:50% 100%}
.p1{transform:rotate(0deg) translateY(-25px)}
.p2{transform:rotate(45deg) translateY(-25px)}
.p3{transform:rotate(90deg) translateY(-25px)}
.p4{transform:rotate(135deg) translateY(-25px)}
.p5{transform:rotate(180deg) translateY(-25px)}
.p6{transform:rotate(225deg) translateY(-25px)}
.p7{transform:rotate(270deg) translateY(-25px)}
.p8{transform:rotate(315deg) translateY(-25px)}

.center{position:absolute;z-index:3;left:50%;top:50%;width:50px;height:50px;
margin:-25px 0 0 -25px;border-radius:50%;
background:radial-gradient(circle,#ffd958 0 15%,#7d4b10 17% 28%,#d08b18 30% 48%,#70400b 50% 100%);
box-shadow:0 0 12px rgba(255,191,20,.8)}

/* partículas */
.particle{position:absolute;z-index:5;top:-30px;color:#ffe04b;font-size:18px;opacity:0;
animation:fall linear infinite}
@keyframes fall{0%{opacity:0;transform:translateY(-20px) rotate(0)}
12%{opacity:.8}100%{opacity:0;transform:translate(70px,110vh) rotate(360deg)}}

/* música */
.music{position:absolute;z-index:50;left:50%;bottom:max(9px,env(safe-area-inset-bottom));
transform:translateX(-50%);width:min(92vw,390px);padding:8px;
background:rgba(8,9,8,.78);border:1px solid rgba(255,226,93,.28);
border-radius:18px;backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.music-label{text-align:center;font:12px Arial,sans-serif;color:#f9eaa0;margin-bottom:5px}
.music iframe{display:block;width:100%;height:72px;border-radius:12px}
.music a{display:block;text-align:center;color:#ffe36c;text-decoration:none;font:11px Arial,sans-serif;margin-top:5px}

/* pantalla de entrada */
#enter{position:absolute;z-index:100;inset:0;background:radial-gradient(circle,#18200f,#020306 70%);
display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
transition:opacity 1.2s}
#enter.hide{opacity:0;pointer-events:none}
#enter p{font-size:15px;letter-spacing:2px;opacity:.75;margin:0 0 12px;padding:0 20px}
#enter h2{font-family:"Great Vibes",cursive;font-size:clamp(46px,14vw,70px);
font-weight:400;color:#ffe36a;margin:0 0 25px}
#start{border:1px solid rgba(255,226,90,.7);background:rgba(255,215,40,.08);
color:#fff5bd;padding:13px 26px;border-radius:30px;font-size:16px;letter-spacing:1px}

@media(max-width:600px){
 .bouquet{height:53%;min-height:400px}
 .flower{width:142px;height:142px}
 .f1{left:-5px;top:25%}
 .f2{left:50%;margin-left:-71px;top:3%}
 .f3{right:-5px;top:25%}
 .f4{left:8%;top:46%}
 .f5{right:8%;top:46%}
 .message{top:41%}
 .music{width:min(92vw,360px)}
}
</style>
</head>
<body>
<div id="app">
  <div id="sky"></div>
  <div class="moon"></div>

  <div id="enter">
    <p>UN PEQUEÑO DETALLE PARA USTED</p>
    <h2>Val, mi perfect girl…</h2>
    <button id="start">🌻 Abrir mi regalo</button>
  </div>

  <div class="title">
    <div class="small">Hoy pensé en usted</div>
    <h1>Para usted, Val, <span>mi perfect girl</span></h1>
  </div>

  <div class="message">
    <div class="line1">Me acordé de usted…</div>
    <div class="line2">Val, mi perfect girl.</div>
    <div class="line3">La amo mucho, <b>Val</b> <span class="heart">♥</span></div>
  </div>

  <div class="bouquet">
    <div class="stem s1"></div><div class="stem s2"></div><div class="stem s3"></div><div class="stem s4"></div>
    <div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div><div class="leaf l4"></div>

    <div class="flower f1"><span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span><span class="petal p4"></span><span class="petal p5"></span><span class="petal p6"></span><span class="petal p7"></span><span class="petal p8"></span><span class="center"></span></div>
    <div class="flower f2"><span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span><span class="petal p4"></span><span class="petal p5"></span><span class="petal p6"></span><span class="petal p7"></span><span class="petal p8"></span><span class="center"></span></div>
    <div class="flower f3"><span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span><span class="petal p4"></span><span class="petal p5"></span><span class="petal p6"></span><span class="petal p7"></span><span class="petal p8"></span><span class="center"></span></div>
    <div class="flower f4"><span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span><span class="petal p4"></span><span class="petal p5"></span><span class="petal p6"></span><span class="petal p7"></span><span class="petal p8"></span><span class="center"></span></div>
    <div class="flower f5"><span class="petal p1"></span><span class="petal p2"></span><span class="petal p3"></span><span class="petal p4"></span><span class="petal p5"></span><span class="petal p6"></span><span class="petal p7"></span><span class="petal p8"></span><span class="center"></span></div>
  </div>

  <div class="music">
    <div class="music-label">♪ Una canción para usted · Bruno Mars</div>
    <iframe src="https://open.spotify.com/embed/track/6skX6In6VpLzev9epAUnpp?utm_source=generator&theme=0"
      frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    <a href="https://www.youtube.com/watch?v=lY5V4hSLWY8" target="_blank">▶ Ver “Risk It All” — video oficial</a>
  </div>
</div>

<script>
const sky=document.getElementById('sky');
for(let i=0;i<115;i++){
  const s=document.createElement('i');
  s.className='star';
  s.style.left=Math.random()*100+'%';
  s.style.top=Math.random()*100+'%';
  s.style.animationDelay=(Math.random()*4)+'s';
  sky.appendChild(s);
}
for(let i=0;i<18;i++){
  const p=document.createElement('span');
  p.className='particle';
  p.textContent='✦';
  p.style.left=Math.random()*100+'%';
  p.style.animationDelay=(Math.random()*9)+'s';
  p.style.animationDuration=(7+Math.random()*5)+'s';
  document.getElementById('app').appendChild(p);
}
document.getElementById('start').onclick=()=>{
  document.getElementById('enter').classList.add('hide');
};
</script>
</body>
</html>
