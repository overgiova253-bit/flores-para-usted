<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para usted, Val, mi perfect girl 🌻</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap');
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#020506;color:white;font-family:"Cormorant Garamond",serif}
#app{position:relative;width:100%;height:100dvh;overflow:hidden;background:
radial-gradient(circle at 50% 65%,rgba(255,210,55,.12),transparent 27%),
radial-gradient(circle at 50% 34%,#111b13 0,#050a0a 45%,#010204 82%)}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.25;animation:twinkle 3.5s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.9;transform:scale(1.6)}}
.moon{position:absolute;z-index:2;top:8%;right:10%;width:78px;height:78px;border-radius:50%;
background:radial-gradient(circle at 35% 35%,#fffce2,#f4dc86 48%,#b99445 100%);
box-shadow:0 0 45px rgba(255,222,120,.28);opacity:.65}

.title{position:absolute;z-index:30;top:7%;left:50%;width:95%;transform:translateX(-50%);
text-align:center;opacity:0;animation:titleIn 1.8s .5s forwards}
.title .small{font-size:17px;letter-spacing:3.5px;opacity:.8;text-transform:uppercase}
.title h1{margin:8px 0 0;font-size:clamp(40px,11.5vw,62px);line-height:.98;font-weight:500;text-shadow:0 0 24px rgba(255,221,75,.3)}
.title span,.message .line2{font-family:"Great Vibes",cursive;color:#ffe36b}
@keyframes titleIn{from{opacity:0;transform:translateX(-50%) translateY(15px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.message{position:absolute;z-index:35;top:40%;left:50%;width:94%;transform:translate(-50%,-50%);
text-align:center;opacity:0;animation:messageIn 1.6s 8.2s forwards}
.message .line1{font-size:clamp(25px,7vw,39px);margin-bottom:5px}
.message .line2{font-size:clamp(43px,11.5vw,62px);line-height:1}
.message .line3{font-size:clamp(20px,5.8vw,30px);margin-top:9px}
.heart{font-size:30px;color:#ffdd43}
@keyframes messageIn{from{opacity:0;transform:translate(-50%,calc(-50% + 18px));filter:blur(6px)}
to{opacity:1;transform:translate(-50%,-50%);filter:blur(0)}}

/* Ramo */
.bouquet{position:absolute;z-index:10;left:50%;bottom:-2%;transform:translateX(-50%);width:100%;height:55%;max-width:520px}
.stem{position:absolute;bottom:0;left:50%;width:7px;border-radius:10px;background:linear-gradient(90deg,#244a24,#9acb45,#244a24);
box-shadow:0 0 9px rgba(120,190,55,.35);transform-origin:bottom;animation:stem 3.1s cubic-bezier(.2,.8,.2,1) both}
.s1{height:66%;margin-left:-54px;animation-delay:1s}.s2{height:78%;margin-left:-18px;animation-delay:1.25s}
.s3{height:72%;margin-left:18px;animation-delay:1.5s}.s4{height:64%;margin-left:54px;animation-delay:1.75s}
@keyframes stem{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.leaf{position:absolute;width:94px;height:40px;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#b7e75a,#377b2c 70%,#1d4c20);
opacity:0;animation:leaf 1.4s 3.6s forwards}
.l1{left:4%;bottom:24%;transform:rotate(22deg)}.l2{left:17%;bottom:9%;transform:rotate(-28deg)}
.l3{right:4%;bottom:23%;transform:rotate(156deg)}.l4{right:17%;bottom:9%;transform:rotate(193deg)}
@keyframes leaf{from{opacity:0;scale:.2}to{opacity:1;scale:1}}

/* Flores SVG: el círculo central y los 8 pétalos comparten EXACTAMENTE el mismo centro */
.flower{position:absolute;width:180px;height:180px;opacity:0;animation:flowerIn 2.7s cubic-bezier(.16,.75,.2,1) forwards}
.f1{left:-2%;top:25%;animation-delay:2.5s}.f2{left:50%;top:1%;margin-left:-90px;animation-delay:3.1s}
.f3{right:-2%;top:25%;animation-delay:3.7s}.f4{left:12%;top:48%;animation-delay:4.3s}
.f5{right:12%;top:48%;animation-delay:4.9s}
@keyframes flowerIn{
0%{opacity:0;transform:translateY(50px) scale(.05) rotate(-8deg)}
55%{opacity:.7;transform:translateY(10px) scale(.72) rotate(-3deg)}
82%{opacity:1;transform:translateY(-3px) scale(1.035) rotate(1deg)}
100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}
}
.flower svg{width:100%;height:100%;display:block;overflow:visible}

/* Partículas */
.particle{position:absolute;z-index:6;top:-30px;color:#ffe04b;font-size:18px;opacity:0;animation:fall linear infinite}
@keyframes fall{0%{opacity:0;transform:translateY(-20px) rotate(0)}12%{opacity:.8}100%{opacity:0;transform:translate(70px,110vh) rotate(360deg)}}

/* Música */
.music{position:absolute;z-index:50;left:50%;bottom:max(9px,env(safe-area-inset-bottom));transform:translateX(-50%);
width:min(92vw,390px);padding:8px;background:rgba(8,9,8,.8);border:1px solid rgba(255,226,93,.28);
border-radius:18px;backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.music-label{text-align:center;font:12px Arial,sans-serif;color:#f9eaa0;margin-bottom:5px}
.music iframe{display:block;width:100%;height:72px;border-radius:12px}
.music a{display:block;text-align:center;color:#ffe36c;text-decoration:none;font:11px Arial,sans-serif;margin-top:5px}

/* Entrada */
#enter{position:absolute;z-index:100;inset:0;background:radial-gradient(circle,#18200f,#020306 70%);
display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;transition:opacity 1.2s}
#enter.hide{opacity:0;pointer-events:none}
#enter p{font-size:15px;letter-spacing:2px;opacity:.75;margin:0 0 12px;padding:0 20px}
#enter h2{font-family:"Great Vibes",cursive;font-size:clamp(46px,14vw,70px);font-weight:400;color:#ffe36a;margin:0 0 25px}
#start{border:1px solid rgba(255,226,90,.7);background:rgba(255,215,40,.08);color:#fff5bd;padding:13px 26px;border-radius:30px;font-size:16px;letter-spacing:1px}

@media(max-width:600px){
 .bouquet{height:55%;min-height:410px}
 .flower{width:180px;height:180px}
 .f1{left:-20px;top:25%}.f2{left:50%;margin-left:-90px;top:1%}.f3{right:-20px;top:25%}
 .f4{left:7%;top:48%}.f5{right:7%;top:48%}
 .message{top:39.5%}
 .music{width:min(92vw,360px)}
}
</style>
</head>
<body>
<div id="app">
<div id="sky"></div><div class="moon"></div>

<div id="enter">
<p>UN PEQUEÑO DETALLE PARA USTED</p>
<h2>Val, mi perfect girl…</h2>
<button id="start">🌻 Abrir mi regalo</button>
</div>

<div class="title"><div class="small">Hoy pensé en usted</div>
<h1>Para usted, Val, <span>mi perfect girl</span></h1></div>

<div class="message">
<div class="line1">Me acordé de usted…</div>
<div class="line2">Val, mi perfect girl.</div>
<div class="line3">La amo mucho, <b>Val</b> <span class="heart">♥</span></div>
</div>

<div class="bouquet">
<div class="stem s1"></div><div class="stem s2"></div><div class="stem s3"></div><div class="stem s4"></div>
<div class="leaf l1"></div><div class="leaf l2"></div><div class="leaf l3"></div><div class="leaf l4"></div>

<!-- Una flor SVG. Todos los pétalos y el centro usan cx=90 cy=90 -->
<div class="flower f1">
<svg viewBox="0 0 180 180" aria-hidden="true">
<defs><radialGradient id="g1"><stop offset="0" stop-color="#fffbd0"/><stop offset=".48" stop-color="#fff15b"/><stop offset="1" stop-color="#f5bf08"/></radialGradient></defs>
<g fill="url(#g1)" stroke="rgba(255,215,30,.15)" stroke-width="1">
<ellipse cx="90" cy="48" rx="22" ry="39"/><ellipse cx="120" cy="60" rx="22" ry="39" transform="rotate(45 120 60)"/>
<ellipse cx="132" cy="90" rx="22" ry="39" transform="rotate(90 132 90)"/><ellipse cx="120" cy="120" rx="22" ry="39" transform="rotate(135 120 120)"/>
<ellipse cx="90" cy="132" rx="22" ry="39" transform="rotate(180 90 132)"/><ellipse cx="60" cy="120" rx="22" ry="39" transform="rotate(225 60 120)"/>
<ellipse cx="48" cy="90" rx="22" ry="39" transform="rotate(270 48 90)"/><ellipse cx="60" cy="60" rx="22" ry="39" transform="rotate(315 60 60)"/>
</g><circle cx="90" cy="90" r="26" fill="#70400b"/><circle cx="90" cy="90" r="19" fill="#d08b18"/><circle cx="90" cy="90" r="11" fill="#ffd958"/>
</svg></div>

<div class="flower f2">
<svg viewBox="0 0 180 180" aria-hidden="true">
<g fill="url(#g1)"><ellipse cx="90" cy="48" rx="22" ry="39"/><ellipse cx="120" cy="60" rx="22" ry="39" transform="rotate(45 120 60)"/><ellipse cx="132" cy="90" rx="22" ry="39" transform="rotate(90 132 90)"/><ellipse cx="120" cy="120" rx="22" ry="39" transform="rotate(135 120 120)"/><ellipse cx="90" cy="132" rx="22" ry="39" transform="rotate(180 90 132)"/><ellipse cx="60" cy="120" rx="22" ry="39" transform="rotate(225 60 120)"/><ellipse cx="48" cy="90" rx="22" ry="39" transform="rotate(270 48 90)"/><ellipse cx="60" cy="60" rx="22" ry="39" transform="rotate(315 60 60)"/></g><circle cx="90" cy="90" r="26" fill="#70400b"/><circle cx="90" cy="90" r="19" fill="#d08b18"/><circle cx="90" cy="90" r="11" fill="#ffd958"/>
</svg></div>

<div class="flower f3">
<svg viewBox="0 0 180 180" aria-hidden="true">
<g fill="url(#g1)"><ellipse cx="90" cy="48" rx="22" ry="39"/><ellipse cx="120" cy="60" rx="22" ry="39" transform="rotate(45 120 60)"/><ellipse cx="132" cy="90" rx="22" ry="39" transform="rotate(90 132 90)"/><ellipse cx="120" cy="120" rx="22" ry="39" transform="rotate(135 120 120)"/><ellipse cx="90" cy="132" rx="22" ry="39" transform="rotate(180 90 132)"/><ellipse cx="60" cy="120" rx="22" ry="39" transform="rotate(225 60 120)"/><ellipse cx="48" cy="90" rx="22" ry="39" transform="rotate(270 48 90)"/><ellipse cx="60" cy="60" rx="22" ry="39" transform="rotate(315 60 60)"/></g><circle cx="90" cy="90" r="26" fill="#70400b"/><circle cx="90" cy="90" r="19" fill="#d08b18"/><circle cx="90" cy="90" r="11" fill="#ffd958"/>
</svg></div>

<div class="flower f4">
<svg viewBox="0 0 180 180" aria-hidden="true">
<g fill="url(#g1)"><ellipse cx="90" cy="48" rx="22" ry="39"/><ellipse cx="120" cy="60" rx="22" ry="39" transform="rotate(45 120 60)"/><ellipse cx="132" cy="90" rx="22" ry="39" transform="rotate(90 132 90)"/><ellipse cx="120" cy="120" rx="22" ry="39" transform="rotate(135 120 120)"/><ellipse cx="90" cy="132" rx="22" ry="39" transform="rotate(180 90 132)"/><ellipse cx="60" cy="120" rx="22" ry="39" transform="rotate(225 60 120)"/><ellipse cx="48" cy="90" rx="22" ry="39" transform="rotate(270 48 90)"/><ellipse cx="60" cy="60" rx="22" ry="39" transform="rotate(315 60 60)"/></g><circle cx="90" cy="90" r="26" fill="#70400b"/><circle cx="90" cy="90" r="19" fill="#d08b18"/><circle cx="90" cy="90" r="11" fill="#ffd958"/>
</svg></div>

<div class="flower f5">
<svg viewBox="0 0 180 180" aria-hidden="true">
<g fill="url(#g1)"><ellipse cx="90" cy="48" rx="22" ry="39"/><ellipse cx="120" cy="60" rx="22" ry="39" transform="rotate(45 120 60)"/><ellipse cx="132" cy="90" rx="22" ry="39" transform="rotate(90 132 90)"/><ellipse cx="120" cy="120" rx="22" ry="39" transform="rotate(135 120 120)"/><ellipse cx="90" cy="132" rx="22" ry="39" transform="rotate(180 90 132)"/><ellipse cx="60" cy="120" rx="22" ry="39" transform="rotate(225 60 120)"/><ellipse cx="48" cy="90" rx="22" ry="39" transform="rotate(270 48 90)"/><ellipse cx="60" cy="60" rx="22" ry="39" transform="rotate(315 60 60)"/></g><circle cx="90" cy="90" r="26" fill="#70400b"/><circle cx="90" cy="90" r="19" fill="#d08b18"/><circle cx="90" cy="90" r="11" fill="#ffd958"/>
</svg></div>
</div>

<div class="music">
<div class="music-label">♪ Una canción para usted · Bruno Mars</div>
<iframe src="https://open.spotify.com/embed/track/6skX6In6VpLzev9epAUnpp?utm_source=generator&theme=0" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
<a href="https://www.youtube.com/watch?v=lY5V4hSLWY8" target="_blank">▶ Ver “Risk It All” — video oficial</a>
</div>
</div>
<script>
const sky=document.getElementById('sky');
for(let i=0;i<115;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*4+'s';sky.appendChild(s)}
for(let i=0;i<18;i++){const p=document.createElement('span');p.className='particle';p.textContent='✦';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*9+'s';p.style.animationDuration=(7+Math.random()*5)+'s';document.getElementById('app').appendChild(p)}
document.getElementById('start').onclick=()=>document.getElementById('enter').classList.add('hide');
</script>
</body>
</html>
